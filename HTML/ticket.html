<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Conf Sign in</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/scripts.js" defer></script>
</head>

<body>
    <img id="circle" src="../Assets/images/pattern-circle.svg" alt="image of circle" aria-hidden="true">
    <div id="mainContainer">
        <a href="index.html"><img src="../Assets/images/logo-full.svg" alt="Coding Conf Logo" id="landingPageLogo"></a>
        <h1 id="landingPageHeading">Congrats, <span id="gradientName">John Doe!</span> Your ticket is ready <span
                id="here">here!</span></h1>
        <h2 id="eventInfo">We have emailed your ticket to <span id="email">johndoe@gmail.com</span> and will send
            updates in the run up to the event.</h2>
        <div id="ticketContainer">
            <img src="../assets/images/logo-mark.svg" alt="Picture of logo" id="confMark">
            <div id="ticketTextInfo">
                <h3 id="confName">Coding Conf</h3>
                <p id="confDate">December 24, 2026 / Austin TX</p>
            </div>
            <img id="profilePicture" src="../assets/images/image-avatar.jpg" alt="Profile picture of you">
            <div id="ticketTextNames">
                <h3 id="userLegal">John Doe</h3>
                <img src="../assets/images/icon-github.svg" alt="Image of github logo" aria-hidden="true"
                    id="githubLogo">
                <p id="userName">@JohnJohnDoe123</p>
            </div>
        </div>
    </div>
</body>

</html>
