<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Conf Sign in</title>
    <link rel="stylesheet" href="css/styles.css">

    <script src="js/scripts.js" defer></script>
</head>

<body>
    <div id="mainContainer">
        <a href="HTML/index.html"><img src="Assets/images/logo-full.svg" alt="Coding Conf Logo"
                id="loginLogo"></a>
        <h1 id="loginHeader">SIGN UP TO GET YOUR TICKET</h1>
        <div id="uploadContainer">
            <img src="Assets/images/icon-upload.svg" alt="Upload icon" id="uploadIcon">
            <label for="uploadProfilePicture" id="dragAndDropLabel">Drag and drop or click to upload</label>
            <input type="file" name="profilePicture" id="uploadProfilePicture" required form="formContainer">

        </div>
        <form action="ticket.html" id="formContainer">
            <div id="inputFieldsContainer">
                <div id="name" class="inputContainer">
                    <label for="nameInput" class="inputLabels">Full Name: </label>
                    <input type="input" class="inputField" required pattern="[\p{L}'\-]+( [\p{L}'\-]+)+">
                </div>
                <div id="email" class="inputContainer">
                    <label for="emailInput" class="inputLabels">Email Address: </label>
                    <input type="email" class="inputField" required>
                </div>
                <div id="githubUser" class="inputContainer">
                    <label for="githubInput" class="inputLabels">Github Username:</label>
                    <input type="input" class="inputField" name="githubInput" required maxlength="39"
                        pattern="[a-zA-Z0-9]+(-[a-zA-Z0-9]+)*">
                </div>
            </div>
            <button id="submitButton"><img src="Assets/images/ticketGraphic.png" alt="Graphic of a ticket"
                    class="ticketImgButton" aria-hidden="true"><span id="submitButtonText">Generate My Ticket</span><img
                    src="Assets/images/ticketGraphic.png" alt="Graphic of a ticket" class="ticketImgButton"
                    aria-hidden="true"></button>
        </form>
    </div>
</body>

</html>
